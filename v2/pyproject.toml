[project]
name = "tradesense"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.33",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pynacl>=1.5",
]

[tool.vercel]
entrypoint = "api/index.py"
